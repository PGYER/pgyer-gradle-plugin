name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Java ${{ matrix.java }})
    # The image ships the Android SDK (ANDROID_HOME) with platform android-35 and build-tools 36.1.0,
    # which the AGP functional tests use.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Java 17 also runs the oldest supported versions: Gradle 8.0.2 and AGP 8.0.2.
        java: [17, 21]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew check -PtestBuildToolsVersion=36.1.0 --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: build/reports/
